[package]
name = "notion-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
directories = "6"
fs2 = "0.4"
getrandom = "0.3"
open = "5"
tempfile = "3"
thiserror = "1"
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.11", features = ["json"] }
rusticnotion = { path = "../rusticnotion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
wiremock = "0.5.2"
